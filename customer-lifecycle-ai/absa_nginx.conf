# ABSA Platform - NGINX Reverse Proxy Configuration
# This file tells NGINX how to serve the frontend and backend.
# Copy the contents of the `server { ... }` block below into your main nginx.conf on the ABSA machine.

server {
    # Listen on standard HTTP port (change to 443 and add SSL certs if using HTTPS)
    listen 80;
    
    # Replace this with your ABSA machine's IP or Domain name
    server_name _;

    # 1. Frontend: Serve the Vue/React 'dist' folder directly
    location / {
        # IMPORTANT: Change this path to exactly where your 'absa-foundry-frontend/dist' folder lives on the ABSA server.
        # Use forward slashes (/) even on Windows.
        root C:/Users/ADMIN/Desktop/uniplexity-ai/ABSA/absa-foundry-frontend/dist;
        index index.html;
        
        # Required for Single Page Applications (SPA) like React or Vue. 
        # Routes all unmatched URLs back to index.html to let the frontend router handle it.
        try_files $uri $uri/ /index.html;
    }

    # 2. Backend API: Forward all /api/ traffic to the ABSA AI Backend Service (Gateway)
    #    The Gateway must be running (e.g. via install_service.ps1) and listening on port 8080.
    location /api/ {
        proxy_pass http://127.0.0.1:8080;
        
        # Forward original client headers so the Python backend knows who made the request
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
