# ETL Configuration - Customer Lifecycle Prediction System
# All values can be overridden by environment variables (ETL_ prefix).
#
# Pipeline selection: the top-level `schema`, `validation`, `transformation`,
# and `target` sections control the currently active pipeline.
#   Active:  customers (raw_customers → customers_clean)
#   Standby: transactions (customer_transactions → customer_transactions_clean)

# Schema drift detection — fail loudly on unexpected columns for regulated banking
schema:
  mode: strict
  expected_columns:
    - customer_id
    - activation_date
    - branch_code
    - country
    - customer_type
    - onboarding_channel
    - date_of_birth
    - gender
    - status

landing:
  base_path: /data/landing
  default_format: parquet
  compression: snappy

staging:
  batch_size: 5000
  truncate_after_load: true

validation:
  enabled: true
  mandatory_fields:
    - customer_id
    - activation_date
    - branch_code
    - country
    - customer_type
    - date_of_birth
    - gender
    - status
  accepted_currencies:
    - ZMW
  accepted_transaction_types:
    - Retail
    - SME
    - Premium
    - Corporate
  accepted_channels:
    - Branch
    - ATM
    - App
    - Web
    - USSD
    - Agent

transformation:
  date_fields:
    - activation_date
    - date_of_birth
  date_output_format: "%Y-%m-%d"
  null_fill_values:
    onboarding_channel: UNKNOWN
    country: ZM

monitoring:
  enabled: true
  collection_interval_seconds: 10
  alert_thresholds:
    quality_score_min: 80
    error_rate_max: 10
    throughput_min: 100

logging:
  enabled: true
  default_level: INFO
  json_format: true

audit:
  enabled: true
  retention_years: 7

checkpoint:
  enabled: true
  save_interval_records: 1000
  save_interval_seconds: 30
  max_retries_per_checkpoint: 3

# ---------------------------------------------------------------------------
# Target tables & columns — drives bulk_insert in run_etl.py
#   Switch for transactions: clean_table: customer_transactions_clean, etc.
# ---------------------------------------------------------------------------
target:
  clean_table: customers_clean
  rejected_table: customers_rejected
  data_columns:
    - customer_id
    - activation_date
    - branch_code
    - country
    - customer_type
    - onboarding_channel
    - date_of_birth
    - gender
    - status
  meta_columns:
    - loaded_at
    - batch_id

