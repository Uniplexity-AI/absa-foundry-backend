# ETL Configuration - Customer Lifecycle Prediction System
# Overhauled for ABSA Integration

schema:
  mode: strict
  expected_columns:
    - customer_number
    - bus_date
    - transaction_code
    - local_amount
    - narrative

landing:
  base_path: /data/landing
  default_format: parquet
  compression: snappy

staging:
  batch_size: 5000
  truncate_after_load: true

validation:
  enabled: true
  mandatory_fields:
    - customer_number
  accepted_currencies:
    - ZMW
    - USD
    - ZAR
  accepted_transaction_types:
    - CREDIT
    - DEBIT
    - TRANSFER
    - PAYMENT
    - Retail
    - SME
    - Premium
    - Corporate
  accepted_channels:
    - Branch
    - ATM
    - App
    - Web
    - USSD
    - Agent
    - POS
    - Online
    - Mobile

transformation:
  date_fields:
    - bus_date
  date_output_format: "%Y-%m-%d"
  null_fill_values:
    country: ZM

business_rules:
  salary_identification:
    keywords: ["salary", "payroll", "sal", "wages"]
    field: narrative
  dormancy:
    inactivity_days: 365
    field: bus_date

monitoring:
  enabled: true
  collection_interval_seconds: 10
  alert_thresholds:
    quality_score_min: 80
    error_rate_max: 10
    throughput_min: 100

logging:
  enabled: true
  default_level: INFO
  json_format: true

audit:
  enabled: true
  retention_years: 7

checkpoint:
  enabled: true
  save_interval_records: 1000
  save_interval_seconds: 30
  max_retries_per_checkpoint: 3

target:
  clean_table: feature_store_shared
  rejected_table: features_rejected
  data_columns:
    - customer_number
  meta_columns:
    - loaded_at
    - batch_id
