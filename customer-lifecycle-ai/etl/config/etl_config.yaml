# ETL Configuration - Customer Lifecycle Prediction System
# All values can be overridden by environment variables (ETL_ prefix).

landing:
  base_path: /data/landing
  default_format: parquet
  compression: snappy

staging:
  batch_size: 5000
  truncate_after_load: true

validation:
  enabled: true
  mandatory_fields:
    - customer_id
    - account_id
    - branch_code
    - transaction_date
    - transaction_type
    - transaction_channel
    - transaction_amount
    - currency
  accepted_currencies:
    - ZAR
    - USD
    - EUR
    - GBP
  accepted_transaction_types:
    - CREDIT
    - DEBIT
    - TRANSFER
    - PAYMENT
  accepted_channels:
    - BRANCH
    - ATM
    - POS
    - ONLINE
    - MOBILE
  duplicate_detection_enabled: true
  duplicate_keys:
    - customer_id
    - account_id
    - branch_code
    - transaction_date
    - transaction_amount
    - transaction_type
    - transaction_channel
  exact_duplicate_strategy: reject
  near_duplicate_strategy: flag

transformation:
  date_fields:
    - transaction_date
  date_output_format: "%Y-%m-%d"
  null_fill_values:
    branch_name: UNKNOWN
    currency: ZAR

monitoring:
  enabled: true
  collection_interval_seconds: 10
  alert_thresholds:
    quality_score_min: 80
    error_rate_max: 10
    throughput_min: 100

logging:
  enabled: true
  default_level: INFO
  json_format: true

audit:
  enabled: true
  retention_years: 7

checkpoint:
  enabled: true
  save_interval_records: 1000
  save_interval_seconds: 30
  max_retries_per_checkpoint: 3
