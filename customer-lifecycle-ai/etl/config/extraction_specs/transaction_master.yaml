# Transaction Master Extraction Spec — ABSA Core Transactions
# Extracts unified transaction stream directly from ABSA DW:
#   - a_brains_trans_zam_base_entries_zm
#
# Usage:
#   python run_etl.py --extraction-spec etl/config/extraction_specs/transaction_master.yaml --force

version: "1.0"
dataset_name: "transaction_master"
trusted_config: true
description: "Unified transaction stream from ABSA DW table a_brains_trans_zam_base_entries_zm into customer_transactions_clean."

versioning:
  engine:
    version: "2.1"
  dataset:
    version: 1
  schema:
    version: 1
  compatibility:
    minimum_engine: "1.0"

primary_entity:
  table: "a_brains_trans_zam_base_entries_zm"
  alias: "txn"
  select_fields:
    - field: "id"
      alias: "transaction_id"
      validation:
        type: "int"
        required: true

    - field: "customer_number"
      alias: "customer_id"
      validation:
        type: "str"
        required: true

    - field: "bus_date"
      alias: "transaction_date"
      validation:
        type: "datetime"
        required: true

    - field: "local_amount"
      alias: "raw_amount"
      validation:
        type: "float"
        required: true

    - field: "narrative"
      alias: "merchant_category"
      validation:
        type: "str"
        required: false

calculated_fields:
  - name: amount
    expression: "ABS(txn.local_amount)"
    output_type: float
  - name: transaction_type
    expression: "CASE WHEN txn.local_amount < 0 THEN 'DEBIT' ELSE 'CREDIT' END"
    output_type: str
  - name: channel
    expression: "CASE WHEN UPPER(COALESCE(txn.narrative, '')) LIKE '%ATM%' THEN 'ATM' WHEN UPPER(COALESCE(txn.narrative, '')) LIKE '%POS%' THEN 'POS' WHEN UPPER(COALESCE(txn.narrative, '')) LIKE '%ONLINE%' OR UPPER(COALESCE(txn.narrative, '')) LIKE '%WEB%' THEN 'ONLINE' WHEN UPPER(COALESCE(txn.narrative, '')) LIKE '%MOBILE%' OR UPPER(COALESCE(txn.narrative, '')) LIKE '%USSD%' THEN 'MOBILE' WHEN UPPER(COALESCE(txn.narrative, '')) LIKE '%BRANCH%' THEN 'BRANCH' ELSE 'BRANCH' END"
    output_type: str
  - name: currency
    expression: "'ZMW'"
    output_type: str

validation:
  enabled: true
  mandatory_fields:
    - transaction_id
    - customer_id
    - transaction_date
    - amount
  accepted_transaction_types:
    - CREDIT
    - DEBIT
    - TRANSFER
    - PAYMENT
  accepted_channels:
    - BRANCH
    - ATM
    - POS
    - ONLINE
    - MOBILE
    - USSD
    - AGENT
  accepted_currencies:
    - ZMW
    - USD
    - ZAR

transform:
  type_casts:
    transaction_id: str
    amount: float

target:
  clean_table: "customer_transactions_clean"
  rejected_table: "customer_transactions_rejected"
  data_columns:
    - transaction_id
    - customer_id
    - transaction_date
    - amount
    - transaction_type
    - channel
    - merchant_category
    - currency
  meta_columns:
    - loaded_at
    - batch_id

streaming:
  enabled: true
  batch_size: 5000
  fetch_strategy: cursor
