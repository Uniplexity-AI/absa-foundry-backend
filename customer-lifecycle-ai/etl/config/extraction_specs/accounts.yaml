version: '1.0'
dataset_name: accounts
description: "Accounts (Table 1) joined with the ownership bridge (Table 2) \xE2\u2020\
  \u2019 accounts_clean."
versioning:
  engine:
    version: '2.1'
  dataset:
    version: 1
  schema:
    version: 1
  compatibility:
    minimum_engine: '1.0'
primary_entity:
  table: Aro_emdw_db.A_BRAINS_TRANS_ZAM_BASE_Daily_accounts_ALL
  alias: acct
  select_fields:
    - field: account_number
      alias: account_id
      validation:
        type: str
        required: true
    - field: current_status
      alias: status
      validation:
        type: str
        required: true
    - field: account_type
      alias: account_type
      validation:
        type: str
        required: false
    - field: date_opened
      alias: opened_date
      validation:
        type: datetime
        required: false
    - field: branch_number
      alias: branch_code
      validation:
        type: str
        required: false
joins:
  - table: Aro_emdw_db.A_AFRICA_BASE_customer_accounts
    alias: xref
    join_type: left
    'on':
      - left: acct.account_number
        right: xref.account_number
    select_fields:
      - field: customer_number
        alias: customer_id
        validation:
          type: str
          required: false
transform:
  type_casts:
    opened_date: datetime
  standardization:
    - field_name: status
      mappings:
        Active: ACTIVE
        active: ACTIVE
        Inactive: INACTIVE
        inactive: INACTIVE
        Dormant: DORMANT
        dormant: DORMANT
        Closed: CLOSED
        closed: CLOSED
