version: '1.0'
dataset_name: customer_360
trusted_config: true
description: 'Unified customer profile extraction from ABSA DW tables into customers_clean.
  Covers every column read by customer_profile_service.py and CustomerDetail.vue so
  that the profile / detail pages render without blank tiles.

  '
versioning:
  engine:
    version: '2.1'
  dataset:
    version: 2
  schema:
    version: 2
  compatibility:
    minimum_engine: '1.0'
incremental:
  enabled: false
primary_entity:
  table: a_africa_zam_base_customers_new
  alias: c
  select_fields:
  - field: customer_number
    alias: customer_id
    validation:
      type: str
      required: true
  - field: account_number
    alias: account_id_tmp
    validation:
      type: str
      required: false
joins:
- table: a_africa_zam_base_customers_new
  alias: cn
  join_type: left
  'on':
  - left: c.customer_number
    right: cn.customer_number
  select_fields:
  - field: sex
    alias: gender
    validation:
      type: str
      required: false
      default: UNKNOWN
  - field: market_segment
    alias: market_segment_code
    validation:
      type: str
      required: false
  - field: risk_level
    alias: risk_level
    validation:
      type: str
      required: false
  - field: risk_score
    alias: risk_score
    validation:
      type: float
      required: false
  - field: current_count
    alias: current_count
    validation:
      type: int
      required: false
  - field: savings_count
    alias: savings_count
    validation:
      type: int
      required: false
  - field: investment_count
    alias: investment_count
    validation:
      type: int
      required: false
  - field: secured_count
    alias: secured_count
    validation:
      type: int
      required: false
  - field: unsecured_count
    alias: unsecured_count
    validation:
      type: int
      required: false
- table: a_africa_zam_base_customer_employment_daily_zm
  alias: ce
  join_type: left
  'on':
  - left: c.customer_number
    right: ce.customer_number
  select_fields:
  - field: country
    alias: nationality
    validation:
      type: str
      required: false
  - field: district_or_region
    alias: branch_code
    validation:
      type: str
      required: false
  - field: gross_income
    alias: gross_income
    validation:
      type: float
      required: false
  - field: other_income
    alias: other_income
    validation:
      type: float
      required: false
  - field: employment_type
    alias: employment_type
    validation:
      type: str
      required: false
  - field: employment_status
    alias: employment_status
    validation:
      type: str
      required: false
  - field: job_title
    alias: job_title
    validation:
      type: str
      required: false
  - field: town_or_city
    alias: town_or_city
    validation:
      type: str
      required: false
- table: Aro_emdw_db.A_BRAINS_TRANS_ZAM_BASE_Daily_accounts_ALL
  alias: acc
  join_type: left
  'on':
  - left: c.account_number
    right: acc.account_number
  select_fields:
  - field: date_opened
    alias: date_opened
    validation:
      type: datetime
      required: false
calculated_fields:
- name: status
  expression: '''ACTIVE'''
  output_type: str
- name: customer_since_date
  expression: acc.date_opened
  output_type: datetime
- name: kyc_tier
  expression: '''Standard'''
  output_type: str
- name: date_of_birth
  expression: '''1980-01-01'''
  output_type: datetime
- name: full_name
  expression: 'NULL'
  output_type: str
- name: market_segment
  expression: cn.market_segment
  output_type: str
- name: account_number
  expression: 'NULL'
  output_type: str
- name: national_id
  expression: 'NULL'
  output_type: str
- name: mobile_number
  expression: 'NULL'
  output_type: str
- name: next_of_kin_name
  expression: 'NULL'
  output_type: str
- name: next_of_kin_relationship
  expression: 'NULL'
  output_type: str
- name: next_of_kin_phone
  expression: 'NULL'
  output_type: str
- name: is_deleted
  expression: 'FALSE'
  output_type: bool
transform:
  type_casts:
    customer_since_date: datetime
    date_of_birth: datetime
  standardization:
  - field_name: gender
    mappings:
      M: MALE
      F: FEMALE
      Male: MALE
      Female: FEMALE
    default_value: UNKNOWN
  - field_name: status
    mappings:
      A: ACTIVE
      Active: ACTIVE
      I: INACTIVE
      Inactive: INACTIVE
      D: DORMANT
      Dormant: DORMANT
      C: CLOSED
      Closed: CLOSED
    default_value: ACTIVE
validation:
  enabled: false
  mandatory_fields:
  - customer_id
target:
  clean_table: customers_clean
  rejected_table: customers_rejected
  data_columns:
  - customer_id
  - full_name
  - date_of_birth
  - gender
  - branch_code
  - customer_since_date
  - kyc_tier
  - nationality
  - status
  - market_segment_code
  - market_segment
  - account_number
  - national_id
  - mobile_number
  - next_of_kin_name
  - next_of_kin_relationship
  - next_of_kin_phone
  - is_deleted
  meta_columns:
  - loaded_at
  - batch_id
streaming:
  enabled: false
  batch_size: 10000
  fetch_strategy: cursor
