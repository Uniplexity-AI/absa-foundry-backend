version: '1.0'
dataset_name: customer_360
trusted_config: true
description: >
  Unified customer profile extraction from ABSA DW tables into customers_clean.
  Covers every column read by customer_profile_service.py and CustomerDetail.vue
  so that the profile / detail pages render without blank tiles.

versioning:
  engine:
    version: '2.1'
  dataset:
    version: 2
  schema:
    version: 2
  compatibility:
    minimum_engine: '1.0'

incremental:
  enabled: false

primary_entity:
  table: a_africa_zam_base_customers_daily_zm
  alias: c
  select_fields:
  - field: customer_number
    alias: customer_id
    validation:
      type: str
      required: true
  - field: customer_status
    alias: status
    validation:
      type: str
      required: false
  - field: kyc_status
    alias: kyc_tier
    validation:
      type: str
      required: false
  - field: display_name
    alias: full_name
    validation:
      type: str
      required: false
  - field: id_card_number
    alias: national_id
    validation:
      type: str
      required: false

# Pre-aggregate MIN(date_opened) grouped by customer_number in a single pass.
# This avoids a correlated subquery (which would run once per customer row).
pre_aggregations:
- name: acct_dates
  from_table: a_africa_zam_base_customer_accounts_daily_zm
  alias: acct_dates
  joins:
  - table: a_brains_trans_zam_base_daily_accounts_all
    alias: acc
    join_type: inner
    'on':
    - left: acct_dates.account_number
      right: acc.account_number
    - left: acct_dates.branch_number
      right: acc.branch_number
    select_fields: []
  group_by:
  - acct_dates.customer_number
  aggregations:
  - function: MIN
    field: acc.date_opened
    alias: customer_since_date

joins:
- table: a_africa_zam_base_customers_daily_zm
  alias: cn
  join_type: left
  'on':
  - left: c.customer_number
    right: cn.customer_number
  select_fields:
  - field: sex
    alias: gender
    validation:
      type: str
      required: false
      default: UNKNOWN
  - field: market_segment
    alias: market_segment_code
    validation:
      type: str
      required: false
  - field: risk_level
    alias: risk_level
    validation:
      type: str
      required: false
  - field: risk_score
    alias: risk_score
    validation:
      type: float
      required: false
  - field: current_count
    alias: current_count
    validation:
      type: int
      required: false
  - field: savings_count
    alias: savings_count
    validation:
      type: int
      required: false
  - field: investment_count
    alias: investment_count
    validation:
      type: int
      required: false
  - field: secured_count
    alias: secured_count
    validation:
      type: int
      required: false
  - field: unsecured_count
    alias: unsecured_count
    validation:
      type: int
      required: false
- table: a_africa_zam_base_customer_employment_daily_zm
  alias: ce
  join_type: left
  'on':
  - left: c.customer_number
    right: ce.customer_number
  select_fields:
  - field: country
    alias: nationality
    validation:
      type: str
      required: false
  - field: district_or_region
    alias: branch_code
    validation:
      type: str
      required: false
  - field: gross_income
    alias: gross_income
    validation:
      type: float
      required: false
  - field: other_income
    alias: other_income
    validation:
      type: float
      required: false
  - field: employment_type
    alias: employment_type
    validation:
      type: str
      required: false
  - field: employment_status
    alias: employment_status
    validation:
      type: str
      required: false
  - field: job_title
    alias: job_title
    validation:
      type: str
      required: false
  - field: town_or_city
    alias: town_or_city
    validation:
      type: str
      required: false
# Join the pre-aggregated customer_since_date CTE
- table: acct_dates
  alias: acct_dates
  join_type: left
  'on':
  - left: c.customer_number
    right: acct_dates.customer_number
  select_fields:
  - field: customer_since_date
    validation:
      type: datetime
      required: false

calculated_fields:
- name: date_of_birth
  expression: 'NULL'
  output_type: datetime
- name: market_segment
  expression: cn.market_segment
  output_type: str
- name: account_number
  expression: 'NULL'
  output_type: str
- name: mobile_number
  expression: 'NULL'
  output_type: str
- name: next_of_kin_name
  expression: 'NULL'
  output_type: str
- name: next_of_kin_relationship
  expression: 'NULL'
  output_type: str
- name: next_of_kin_phone
  expression: 'NULL'
  output_type: str
- name: is_deleted
  expression: 'NULL'
  output_type: bool

transform:
  type_casts:
    customer_since_date: datetime
    date_of_birth: datetime
  standardization:
  - field_name: gender
    mappings:
      M: MALE
      F: FEMALE
      Male: MALE
      Female: FEMALE
  - field_name: status
    mappings:
      A: ACTIVE
      Active: ACTIVE
      I: INACTIVE
      Inactive: INACTIVE
      D: DORMANT
      Dormant: DORMANT
      C: CLOSED
      Closed: CLOSED
    default_value: ACTIVE

validation:
  enabled: false
  mandatory_fields:
  - customer_id

target:
  clean_table: customers_clean
  rejected_table: customers_rejected
  data_columns:
  - customer_id
  - full_name
  - date_of_birth
  - gender
  - branch_code
  - customer_since_date
  - kyc_tier
  - nationality
  - status
  - market_segment_code
  - market_segment
  - account_number
  - national_id
  - mobile_number
  - next_of_kin_name
  - next_of_kin_relationship
  - next_of_kin_phone
  - is_deleted
  meta_columns:
  - loaded_at
  - batch_id

streaming:
  enabled: false
  batch_size: 10000
  fetch_strategy: cursor
