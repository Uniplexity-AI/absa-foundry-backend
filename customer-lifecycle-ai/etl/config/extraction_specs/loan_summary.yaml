# Loan Summary — Per-customer loan presence
# Pre-aggregates loans_los per customer. Unlocks: rel_has_loan
#
# Usage:
#   python run_etl.py --extraction-spec etl/config/extraction_specs/loan_summary.yaml

version: "1.0"
dataset_name: "loan_summary"
trusted_config: true
description: "Per-customer loan data: types, status."

primary_entity:
  table: "public.loans_los"
  alias: "loan"
  select_fields:
    - field: "loan_id"
      alias: "loan_id"
      validation: { type: "str", required: true }
    - field: "customer_id"
      alias: "customer_id"
      validation: { type: "str", required: true }
    - field: "loan_type"
      alias: "loan_type"
      validation: { type: "str", required: false }
    - field: "status"
      alias: "status"
      validation: { type: "str", required: false }
    - field: "origination_date"
      alias: "origination_date"
      validation: { type: "datetime", required: false }

# Transform: dates are text → datetime; standardize status & loan_type
transform:
  type_casts:
    origination_date: datetime
  standardization:
    - field_name: status
      mappings:
        Active: ACTIVE
        active: ACTIVE
        Paid Off: PAID_OFF
        paid off: PAID_OFF
        Default: DEFAULTED
        default: DEFAULTED
        Written Off: WRITTEN_OFF
        written off: WRITTEN_OFF
      default_value: UNKNOWN
    - field_name: loan_type
      mappings:
        Personal: PERSONAL
        personal: PERSONAL
        Mortgage: MORTGAGE
        mortgage: MORTGAGE
        Auto: AUTO
        auto: AUTO
        Business: BUSINESS
        business: BUSINESS
      default_value: UNKNOWN

# Target: loan data → loans_clean
target:
  clean_table: loans_clean
  data_columns:
    - loan_id
    - customer_id
    - loan_type
    - status
    - origination_date
