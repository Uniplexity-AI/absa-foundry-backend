# Card Summary — ABSA DW s_caas_sparrow_zam_base_crdrep
# Extracts card data into cards_clean
#
# Usage:
#   python run_etl.py --extraction-spec etl/config/extraction_specs/card_summary.yaml --force

version: "1.0"
dataset_name: "card_summary"
trusted_config: true
description: "Per-customer card data from ABSA DW table s_caas_sparrow_zam_base_crdrep into cards_clean."

versioning:
  engine:
    version: "2.1"
  dataset:
    version: 1
  schema:
    version: 1
  compatibility:
    minimum_engine: "1.0"

primary_entity:
  table: "s_caas_sparrow_zam_base_crdrep"
  alias: "card"
  select_fields:
    - field: "crd_acct_num"
      alias: "card_id"
      validation: { type: "str", required: true }
    - field: "customer_number"
      alias: "customer_id"
      validation: { type: "str", required: true }
    - field: "eff_sta_dte"
      alias: "issued_date"
      validation: { type: "datetime", required: false }
    - field: "eff_end_dte"
      alias: "expiry_date"
      validation: { type: "datetime", required: false }

calculated_fields:
  - name: activated_date
    expression: "card.eff_sta_dte"
    output_type: datetime
  - name: card_type
    expression: "'DEBIT'"
    output_type: str
  - name: status
    expression: "CASE WHEN card.eff_end_dte IS NULL OR card.eff_end_dte > CURRENT_DATE THEN 'ACTIVE' ELSE 'EXPIRED' END"
    output_type: str

validation:
  enabled: true
  mandatory_fields:
    - card_id
    - customer_id
  duplicate_keys:
    - card_id

target:
  clean_table: "cards_clean"
  data_columns:
    - card_id
    - customer_id
    - card_type
    - status
    - issued_date
    - expiry_date
    - activated_date
  meta_columns:
    - loaded_at
    - batch_id

streaming:
  enabled: true
  batch_size: 5000
  fetch_strategy: cursor
